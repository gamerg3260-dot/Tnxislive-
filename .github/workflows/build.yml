name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew file not found. Generating wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure .env file exists for Secrets Plugin
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating fallback .env configuration..."
            touch .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AIzaSyDefaultPlaceholderApiKey' }}" >> .env
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Max-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
